name: Acceso a la fortaleza prohibida

on: 
 workflow_dispatch:

jobs:
  acceso-a-la-base:
    runs-on: ubuntu-latest

    steps:
      - name: El agente llega a la fortaleza
        run: |
            echo "Agente ${{ github.actor }} llega a la fortaleza"
            echo ""
            echo "Buscar los archivos de la legión"
            ls -la
            echo ""
            echo "Pero qué pasó? no hay nada!"

      - name: 'Brainiac desbloquea la bóveda'
        uses: actions/checkout@v4

      - name: 'Ahora si, vamos a ver los planes'
        run: |
            echo "Buscar los archivos de la legión"
            ls -la
            echo "Funciona!!!"
            echo ""
            echo "Planes"
            ls planes/
            echo "Villanos"
            ls villanos/
            echo "inteligencia"
            ls inteligencia/