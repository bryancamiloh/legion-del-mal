name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs:
      Villano:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      Mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La misión fue un éxito"
      
      Prioridad:
        description: "Nivel de priporidad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Imprimir inputs"
        run: |
          echo "Inputs:"
          echo ""
          echo "Villano: ${{ inputs.Villano }}"
          echo "Nivel: ${{ inputs.Prioridad }}"
          echo "Villano: ${{ inputs.Mensaje }}"