name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs:
      Villano:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      Mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La misión fue un éxito"
      
      Prioridad:
        description: "Nivel de priporidad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la legión
        run: sudo apt-get install -y cowsay

      - name: "Imprimir inputs"
        run: |
          echo "====================================="
          echo "      Transmisión interceptada       "
          echo "====================================="
          echo ""
          echo "De: ${{ inputs.Villano }}"
          echo ""
          echo "fecha: $( date -u +'%d/%m/%Y  - %H:%M UTC')"
          echo "----Mensaje----"
          cowsay -f eyes "${{ inputs.Mensaje }}"
          echo ""
          echo "--- ${{ inputs.Villano }}"
          echo "..."